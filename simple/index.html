<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kolobok VPN — магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">🛡</div>
        <div class="brand-name">Kolobok <span>VPN</span></div>
      </div>
      <div class="topbar-user" id="topbarUser"></div>
    </header>

    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar">
      <button class="tabbar-item active" data-tab="shop">
        <span class="tabbar-icon">🛍</span>
        <span class="tabbar-label">Магазин</span>
      </button>
      <button class="tabbar-item" data-tab="keys">
        <span class="tabbar-icon">🔑</span>
        <span class="tabbar-label">Мои ключи</span>
      </button>
      <button class="tabbar-item" data-tab="friends">
        <span class="tabbar-icon">🎁</span>
        <span class="tabbar-label">Друзья</span>
      </button>
      <button class="tabbar-item" data-tab="help">
        <span class="tabbar-icon">📋</span>
        <span class="tabbar-label">Помощь</span>
      </button>
    </nav>
  </div>

  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-logo">🛡</div>
      <div class="gate-title">Kolobok VPN</div>
      <div class="gate-text" id="gateText">Запускаем приложение…</div>
      <div class="loader" id="gateLoader"></div>
      <button class="btn btn-primary hidden" id="gateBtn">Открыть бота</button>
    </div>
  </div>

  <div class="sheet-backdrop hidden" id="sheetBackdrop">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="overlay hidden" id="overlay"></div>

    <button class="support-fab" id="supportFab" aria-label="Поддержка">💬</button>

    <div class="toast hidden" id="toast"></div>

  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
