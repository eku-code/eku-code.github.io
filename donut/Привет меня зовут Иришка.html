<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Иришка 💖 — официальный сайт</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff6b9d;
    --pink-dark: #e8447a;
    --purple: #a855f7;
    --bg-1: #1a0b2e;
    --bg-2: #2d1b4e;
    --text: #fdf2f8;
    --muted: #d8b4fe;
  }

  body {
    font-family: 'Segoe UI', 'Georgia', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, #3b1053 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    padding: 20px;
  }

  /* Мерцающие звёзды на фоне */
  body::before, body::after {
    content: '';
    position: fixed;
    width: 300px; height: 300px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .35;
    z-index: 0;
    animation: float 12s ease-in-out infinite;
  }
  body::before { background: var(--pink); top: -100px; left: -100px; }
  body::after  { background: var(--purple); bottom: -100px; right: -100px; animation-delay: -6s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(40px, 30px) scale(1.15); }
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 560px;
    width: 100%;
    text-align: center;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 32px;
    padding: 60px 40px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    animation: rise .8s ease-out both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 130px; height: 130px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    box-shadow: 0 0 0 6px rgba(255, 107, 157, 0.2),
                0 0 40px rgba(255, 107, 157, 0.5);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 6px rgba(255,107,157,.2), 0 0 40px rgba(255,107,157,.5); }
    50%      { box-shadow: 0 0 0 12px rgba(255,107,157,.1), 0 0 70px rgba(255,107,157,.7); }
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #ffd1e3, var(--pink), #c084fc, var(--pink), #ffd1e3);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: 1.25rem;
    color: var(--muted);
    line-height: 1.7;
    margin-bottom: 40px;
  }

  .subtitle strong { color: var(--text); }

  .divider {
    width: 80px; height: 3px;
    margin: 0 auto 40px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }

  .donate-title {
    font-size: 1.1rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .donate-title .arrow { color: var(--pink); animation: nudge 1.2s ease-in-out infinite; display: inline-block; }

  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(8px); }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 18px 48px;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 60px;
    background: linear-gradient(135deg, var(--pink), var(--pink-dark), var(--purple));
    background-size: 200% auto;
    box-shadow: 0 10px 30px rgba(232, 68, 122, 0.5);
    transition: transform .25s ease, box-shadow .25s ease, background-position .5s ease;
    cursor: pointer;
    border: none;
  }

  .btn:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 18px 45px rgba(232, 68, 122, 0.7);
    background-position: right center;
  }

  .btn:active { transform: translateY(0) scale(.98); }

  .btn .plus {
    width: 30px; height: 30px;
    background: rgba(255,255,255,.25);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    line-height: 1;
  }

  .links {
    margin-top: 36px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .links a {
    padding: 10px 22px;
    border-radius: 40px;
    font-size: .95rem;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,.2);
    transition: all .25s ease;
  }

  .links a:hover {
    color: #fff;
    border-color: var(--pink);
    background: rgba(255, 107, 157, .15);
    transform: translateY(-2px);
  }

  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 2; overflow: hidden; }

  .heart {
    position: absolute;
    bottom: -40px;
    font-size: 22px;
    animation: fly linear infinite;
    opacity: 0;
  }

  @keyframes fly {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    10%  { opacity: .8; }
    90%  { opacity: .6; }
    100% { opacity: 0; transform: translateY(-110vh) rotate(360deg); }
  }

  footer {
    margin-top: 40px;
    font-size: .85rem;
    color: rgba(216, 180, 254, .6);
  }

  @media (max-width: 480px) {
    .card { padding: 44px 24px; }
    h1 { font-size: 2rem; }
    .btn { padding: 16px 36px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<main class="card">
  <div class="avatar">🎀</div>

  <h1>Привет, меня зовут Иришка!</h1>

  <p class="subtitle">
    Это мой <strong>первый сайт</strong>.<br>
    Мне очень приятно, что вы здесь 💜
  </p>

  <div class="divider"></div>

  <p class="donate-title">
    Кидайте донаты сюда <span class="arrow">››››››</span>
  </p>

  <a class="btn" href="https://yoomoney.ru/quickpay" target="_blank" rel="noopener">
    <span class="plus">+</span> Донат
  </a>

  <nav class="links">
    <a href="#" target="_blank" rel="noopener">💬 Telegram</a>
    <a href="#" target="_blank" rel="noopener">📸 Instagram</a>
    <a href="#" target="_blank" rel="noopener">☕ Boosty</a>
  </nav>

  <footer>© 2026 Иришка · Сделано с любовью 💖</footer>
</main>

<script>
  // Летающие сердечки на фоне
  const container = document.getElementById('hearts');
  const symbols = ['💖', '💜', '✨', '🎀', '💕'];

  function spawnHeart() {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.animationDuration = (7 + Math.random() * 8) + 's';
    container.appendChild(h);
    setTimeout(() => h.remove(), 15000);
  }

  setInterval(spawnHeart, 900);
  for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 400);
</script>

</body>
</html>
